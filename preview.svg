<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="816" viewBox="0 0 1216 816">
  <defs>
    <radialGradient id="glow" cx="38%" cy="52%" r="60%">
      <stop offset="0" stop-color="#24F6D2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#24F6D2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071012"/>
      <stop offset="1" stop-color="#030506"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-150%" width="220%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1216" height="816" fill="url(#bg)"/>
  <rect width="1216" height="816" fill="url(#glow)"/>

  <!-- header -->
  <text x="108" y="96" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="52" fill="#F0FFFC">Caps Lock Indicator</text>
  <text x="108" y="140" font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#91A5A2">Shows up at your text cursor, in any Wayland app.</text>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="108" y="184" width="1000" height="380" rx="18" fill="#0A1214" stroke="#1B2E2E" stroke-width="2"/>
  </g>
  <path d="M108 202a18 18 0 0 1 18-18h964a18 18 0 0 1 18 18v38H108z" fill="#0E191B"/>
  <line x1="108" y1="240" x2="1108" y2="240" stroke="#1B2E2E" stroke-width="2"/>
  <circle cx="146" cy="212" r="7" fill="#3C5552"/>
  <circle cx="172" cy="212" r="7" fill="#3C5552"/>
  <circle cx="198" cy="212" r="7" fill="#3C5552"/>

  <!-- terminal text -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="34">
    <text x="156" y="306" fill="#526966">$ ls ~</text>
    <text x="156" y="354" fill="#526966">Documents  Downloads  Music</text>
    <text x="156" y="426" fill="#D4E1DF">$ GIT STATUS</text>
  </g>

  <!-- caret -->
  <rect x="406" y="396" width="14" height="40" fill="#24F6D2"/>

  <!-- link from caret to pill -->
  <path d="M413 440v12" stroke="#24F6D2" stroke-width="3" stroke-linecap="round"/>

  <!-- the pill: exact shape drawn by the plugin, scaled 2.4x -->
  <g transform="translate(398 458) scale(2.4)">
    <rect x="-2" y="-2" width="68" height="24" rx="8" fill="#24F6D2" opacity="0.55" filter="url(#soft)"/>
    <rect width="64" height="20" rx="6" fill="#24F6D2"/>
    <path d="M11 4 L16 10 L13 10 L13 13 L9 13 L9 10 L6 10 Z" fill="#030506"/>
    <rect x="9" y="15" width="4" height="1.5" fill="#030506"/>
    <text x="21" y="14.5" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="11" fill="#030506">CAPS</text>
  </g>

  <!-- callout -->
  <path d="M572 482h74" stroke="#24F6D2" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <text x="668" y="480" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="25" fill="#F0FFFC">Right where you're typing</text>
  <text x="668" y="516" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#91A5A2">Only when the app reports a caret.</text>

  <!-- footer -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#91A5A2" text-anchor="middle">
    <text x="608" y="680">Follows your Omarchy theme   ·   Zero config   ·   Native and lightweight</text>
  </g>
</svg>
